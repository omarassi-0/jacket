<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  
  <!-- Instant Redirect Tag (Replace the URL inside url=...) -->
  <meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=W74y1RxN6BA">
  
  <!-- Fallback JavaScript Redirect -->
  <script type="text/javascript">
    window.location.href = "https://www.youtube.com/watch?v=W74y1RxN6BA";
  </script>
</head>
<body style="background-color: #0f172a; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
  
  <!-- Fallback message in case someone has JS disabled -->
  <div style="text-align: center;">
    <p style="font-size: 1.1rem;">Redirecting...</p>
    <p style="font-size: 0.9rem; color: #94a3b8;">
      If you are not redirected automatically, <a href="https://www.youtube.com/watch?v=W74y1RxN6BA" style="color: #38bdf8;">click here</a>.
    </p>
  </div>

</body>
</html>
